# Fangbuch-App lokal starten:  docker compose up --build
#   Admin-Oberfläche  http://localhost:8787/admin/   (Demo-Konto: vorstand@demo.fvw.invalid)
#   App im Browser    http://localhost:8790
# Läuft im DEMO-MODUS (Mock-Integrationen, keine E-Mails an echte Personen). Nicht für Produktion.
name: fvw-fangbuch

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fvw_dev
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fvw_dev"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fvw_dev
      PUBLIC_BASE_URL: http://localhost:8787
      DEMO_MODE: "true"
      CORS_ORIGINS: "*"
      JOBS_ENABLED: "true"
      FAIRGATE_MODE: demo
      EVENTFROG_MODE: demo
      WEBSITE_MODE: demo
      MAIL_MODE: draft
      PUSH_MODE: draft
      MYMAPS_MODE: live
      # Google-Kartenhintergrund: Schlüssel in die Datei .env neben dieser Datei schreiben
      # (Zeile GOOGLE_MAPS_API_KEY=...). Ohne Schlüssel zeigt die App nur swisstopo.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - backend-data:/app-data
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  web:
    build:
      context: .
      target: web
      args:
        EXPO_PUBLIC_API_URL: http://localhost:8787
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8790:8790"

volumes:
  db-data:
  backend-data:
